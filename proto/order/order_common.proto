syntax = "proto3";

package pb;

import "common/api.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/MamangRust/microservice-ecommerce-shared/pb";

message FindByIdOrderRequest {
    int32 id = 1;
}

message OrderResponse {
    int32 id = 1;
    int32 merchant_id = 2;
    int32 user_id = 3;
    int32 total_price = 4;
    string created_at = 5;
    string updated_at = 6;
}
  
message OrderResponseDeleteAt {
    int32 id = 1;
    int32 merchant_id = 2;
    int32 user_id = 3;
    int32 total_price = 4;
    string created_at = 5;
    string updated_at = 6;
    google.protobuf.StringValue deleted_at = 7;
}

message ApiResponseOrder {
    string status = 1;
    string message = 2;
    OrderResponse data = 3;
}

message ApiResponseOrderDeleteAt{
    string status = 1;
    string message = 2;
    OrderResponseDeleteAt data = 3;
}

message ApiResponsesOrder {
    string status = 1;
    string message = 2;
    repeated OrderResponse data = 3;
}

message ApiResponseOrderDelete {
    string status = 1;
    string message = 2;
}

message ApiResponseOrderAll {
    string status = 1;
    string message = 2;
}

message ApiResponsePaginationOrderDeleteAt {
    string status = 1;
    string message = 2;
    repeated OrderResponseDeleteAt data = 3;
    PaginationMeta pagination = 4;
}

message ApiResponsePaginationOrder {
    string status = 1;
    string message = 2;
    repeated OrderResponse data = 3;
    PaginationMeta pagination = 4;
}
